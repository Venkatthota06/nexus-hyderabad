name: Temporary dependency update

on:
  push:
    branches:
      - fix/security-data-reliability-followup
    paths:
      - ".github/workflows/dependency-update.yml"

permissions:
  contents: write

jobs:
  update-dependencies:
    if: ${{ !contains(github.event.head_commit.message, '[deps-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-data-reliability-followup
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate synchronized dependency files
        run: |
          if ! grep -q '"next": "16.3.3"' package.json; then
            echo "Dependency update already applied; nothing to do."
            exit 0
          fi
          npm install next@16.4.3 pdf-to-img@7.0.1 --save-exact
      - name: Validate updated dependencies
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nexus_ci
          AUTH_SECRET: ci-only-not-a-production-secret
          NEXTAUTH_SECRET: ci-only-not-a-production-secret
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Commit synchronized files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/dependency-update.yml
          git commit -m "Update Next.js and PDF processing dependencies [deps-updated]"
          git push origin HEAD:fix/security-data-reliability-followup
