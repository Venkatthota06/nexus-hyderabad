name: Verify application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/security-data-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nexus_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        if: always()
        run: npx tsc --noEmit
      - name: Production build
        if: always()
        run: npm run build
