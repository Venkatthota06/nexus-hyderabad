name: Verify application

on:
  pull_request:
    branches: [main, fix/security-data-reliability]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  # Keep in-flight verification runs so newer commits do not silently cancel required checks.
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nexus_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify PostgreSQL service
        run: |
          pg_isready --host localhost --port 5432 --username ci --dbname nexus_ci
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 AS database_ready;"
      - name: Install dependencies
        run: npm ci
      - name: Initialize isolated CI database schema
        run: npx prisma db init
      - name: Smoke-test application database schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO "company" ("id", "name", "updatedAt")
          VALUES ('ci-schema-smoke-test', 'CI schema smoke test', NOW());
          DO $body$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM "company" WHERE "id" = 'ci-schema-smoke-test') THEN
              RAISE EXCEPTION 'Company insert/read smoke test failed';
            END IF;
          END
          $body$;
          ROLLBACK;
          SQL
      - name: Verify database ownership query boundaries
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO "company" ("id", "name", "updatedAt")
          VALUES ('ci-authz-company', 'CI authorization fixture', NOW());
          INSERT INTO "lead" ("id", "name", "company", "phone", "email", "service", "requirement", "salesOwner", "updatedAt")
          VALUES
            ('ci-authz-lead-owned', 'Owned lead', 'CI authorization fixture', '0000000000', 'owned@example.invalid', 'IAQ', 'CI fixture', 'Venkat', NOW()),
            ('ci-authz-lead-other', 'Other lead', 'CI authorization fixture', '0000000001', 'other@example.invalid', 'IAQ', 'CI fixture', 'Other', NOW());
          INSERT INTO "quotation" ("id", "companyId", "quotationNumber", "service", "amount", "gstAmount", "totalAmount", "quotationDate", "salesOwner", "updatedAt")
          VALUES
            ('ci-authz-quotation-owned', 'ci-authz-company', 'CI-AUTHZ-OWNED', 'IAQ', 100, 18, 118, NOW(), 'Venkat', NOW()),
            ('ci-authz-quotation-other', 'ci-authz-company', 'CI-AUTHZ-OTHER', 'IAQ', 100, 18, 118, NOW(), 'Other', NOW());
          DO $body$
          BEGIN
            IF (SELECT COUNT(*) FROM "lead" WHERE "id" LIKE 'ci-authz-lead-%' AND LOWER(BTRIM("salesOwner")) = LOWER(BTRIM(' Venkat '))) <> 1 THEN
              RAISE EXCEPTION 'TEAM lead ownership filter did not isolate the assigned lead';
            END IF;
            IF (SELECT COUNT(*) FROM "quotation" WHERE "id" LIKE 'ci-authz-quotation-%' AND LOWER(BTRIM("salesOwner")) = LOWER(BTRIM('venkat'))) <> 1 THEN
              RAISE EXCEPTION 'TEAM quotation ownership filter did not isolate the assigned quotation';
            END IF;
            IF (SELECT COUNT(*) FROM "lead" WHERE "id" LIKE 'ci-authz-lead-%') <> 2 THEN
              RAISE EXCEPTION 'Management lead visibility fixture is incomplete';
            END IF;
            IF (SELECT COUNT(*) FROM "quotation" WHERE "id" LIKE 'ci-authz-quotation-%') <> 2 THEN
              RAISE EXCEPTION 'Management quotation visibility fixture is incomplete';
            END IF;
          END
          $body$;
          ROLLBACK;
          SQL
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Dependency audit summary
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const meta = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit totals:", JSON.stringify(meta));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : {
                  name: v.name, title: v.title, range: v.range, url: v.url
                })
              }));
            }
          '
