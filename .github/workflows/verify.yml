name: Verify application

on:
  pull_request:
    branches: [main, fix/security-data-reliability]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  # Keep in-flight verification runs so newer commits do not silently cancel required checks.
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nexus_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify PostgreSQL service
        run: |
          pg_isready --host localhost --port 5432 --username ci --dbname nexus_ci
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 AS database_ready;"
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Dependency audit summary
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const meta = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit totals:", JSON.stringify(meta));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : {
                  name: v.name, title: v.title, range: v.range, url: v.url
                })
              }));
            }
          '
